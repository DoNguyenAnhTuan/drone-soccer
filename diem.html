<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EIU DRONE - Scoreboard</title>
<style>
body {
  font-family: sans-serif;
  background: #000;
  color: #fff;
  margin: 0;
  padding: 0;
  text-align: center;
}
.header {
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(to right, red 50%, #0066cc 50%);
  color: white;
  padding: 10px;
  font-size: 24px;
  font-weight: bold;
}
.team-names {
  display: flex;
  justify-content: space-around;
  font-size: 18px;
  margin: 10px 0;
}
.team-names input {
  background: transparent;
  border: none;
  border-bottom: 2px solid #fff;
  color: white;
  font-size: 18px;
  text-align: center;
  width: 200px;
}
.scoreboard {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px auto;
  gap: 40px;
}
.circle {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 80px;
  font-weight: bold;
}
.red-circle {
  border: 8px solid red;
  color: white;
}
.blue-circle {
  border: 8px solid #00aaff;
  color: white;
}
.vs {
  font-size: 48px;
  font-weight: bold;
  margin: 0 20px;
}
.timer {
  font-size: 36px;
  margin: 20px;
}
.fouls {
  display: flex;
  justify-content: space-between;
  padding: 0 50px;
  font-size: 50px;
}
.foul-box-red {
  border: 4px solid red;
  border-radius: 10px;
  padding: 10px;
  min-width: 80px;
}
.foul-box-blue {
  border: 4px solid blue;
  border-radius: 10px;
  padding: 10px;
  min-width: 80px;
}
/* Countdown overlay */
#countdownOverlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  font-size: 200px;
  font-weight: bold;
  color: white;
  z-index: 999;
}
</style>
</head>
<body>

<div class="header">EIU DRONE SOCCER CHAMPIONSHIP 2026</div>
<div class="team-names">
  <input id="redName" value="Đội 1" />
  <input id="blueName" value="Đội 2" />
</div>
<div class="scoreboard">
  <div class="circle red-circle" id="redScore">0</div>
  <div class="vs">VS</div>
  <div class="circle blue-circle" id="blueScore">0</div>
</div>
<div class="timer" id="timer">03:00.0</div>
<div class="fouls">
  <div class="foul-box-red"><span id="redFouls">0</span></div>
  <div class="foul-box-blue"><span id="blueFouls">0</span></div>
</div>

<div id="countdownOverlay"></div>

<audio id="beep" src="coi.mp3" preload="auto"></audio>
<audio id="finalBeep" src="coi.mp3" preload="auto"></audio>

<script>
let redScore = 0, blueScore = 0, redFouls = 0, blueFouls = 0;
let totalTime = 180000; // 3 phút
let pausedTime = totalTime;
let timerRunning = false;
let timerInterval;

const timerElement = document.getElementById("timer");
const beep = document.getElementById("beep");
const finalBeep = document.getElementById("finalBeep");
const countdownOverlay = document.getElementById("countdownOverlay");

function updateScores() {
  document.getElementById("redScore").innerText = redScore;
  document.getElementById("blueScore").innerText = blueScore;
  document.getElementById("redFouls").innerText = redFouls;
  document.getElementById("blueFouls").innerText = blueFouls;
}
// Phát còi đầu GO! dài gấp đôi
function playBeepLong(audioElement) {
  audioElement.currentTime = 0;
  audioElement.play();
  setTimeout(() => {
    audioElement.currentTime = 0;
    audioElement.play();
  }, audioElement.duration * 1000); // nửa thời lượng để nối liền
}



function startTimer() {
  if(timerRunning) return;
  let endTime = Date.now() + pausedTime;
  timerRunning = true;
  timerInterval = setInterval(() => {
    let remaining = endTime - Date.now();
    pausedTime = remaining;
    if(remaining <= 0){
      clearInterval(timerInterval);
      timerElement.innerText = "00:00.0";
      timerRunning = false;
      pausedTime = 0;
      playBeepLong(finalBeep); // TIẾNG CÒI KẾT THÚC
      return;
    }
    let m = Math.floor(remaining / 60000);
    let s = Math.floor((remaining % 60000)/1000);
    let t = Math.floor((remaining % 1000)/100);
    timerElement.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${t}`;
  }, 100);
}

function pauseTimer(){
  if(timerRunning){
    clearInterval(timerInterval);
    timerRunning = false;
  }
}

function resetAll(){
  redScore=blueScore=redFouls=blueFouls=0;
  updateScores();
  pausedTime = totalTime;
  timerElement.innerText = "03:00.0";
  pauseTimer();
}

function startCountdownThenTimer() {
  if (timerRunning) return;

  countdownOverlay.style.display = "flex";
  let count = 3;
  countdownOverlay.innerText = count;

  let interval = setInterval(() => {
    count--;

    if (count > 0) {
      countdownOverlay.innerText = count; // 3,2,1 hiển thị
    } else if (count === 0) {
      countdownOverlay.innerText = "GO!";
      // Thổi còi 1 lần duy nhất khi GO! xuất hiện
      beep.currentTime = 0;
      playBeepLong(beep);
    } else {
      clearInterval(interval);
      countdownOverlay.style.display = "none";
      startTimer(); // Bắt đầu chạy timer 3 phút
    }
  }, 1000);
}



document.addEventListener('keydown', e=>{
  switch(e.key){
    case 'w': redScore++; break;
    case 's': redScore--; break;
    case '0': blueScore++; break;
    case '-': blueScore--; break;
    case '1': redFouls++; break;
    case '2': redFouls--; break;
    case '9': blueFouls++; break;
    case '8': blueFouls--; break;
    case 'r': resetAll(); break;
    case 'p': startCountdownThenTimer(); break;
    case '7': pauseTimer(); break;
  }
  updateScores();
});
</script>
</body>
</html>
